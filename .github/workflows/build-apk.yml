name: Build MINHAJ APPS APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Create Android project
    run: |
      mkdir -p MinhajApps/app/src/main/java/com/minhaj/apps
      mkdir -p MinhajApps/app/src/main/res/layout
      mkdir -p MinhajApps/app/src/main/res/values
      mkdir -p MinhajApps/app/src/main/res/drawable

      cd MinhajApps

      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }

      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }

      rootProject.name = "MinhajApps"
      include(":app")
      EOF

      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.6.1' apply false
      }
      EOF

      cat > gradle.properties <<'EOF'
      org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
      android.useAndroidX=true
      EOF

      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
      }

      android {
          namespace 'com.minhaj.apps'
          compileSdk 35

          defaultConfig {
              applicationId 'com.minhaj.apps'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName "1.0"
          }
      }

      dependencies {
          implementation 'androidx.appcompat:appcompat:1.7.0'
      }
      EOF

      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">

          <uses-permission android:name="android.permission.INTERNET"/>

          <application
              android:theme="@style/AppTheme"
              android:label="MINHAJ APPS"
              android:icon="@drawable/app_icon"
              android:usesCleartextTraffic="false">

              <activity
                  android:name=".MainActivity"
                  android:screenOrientation="portrait"
                  android:exported="true">

                  <intent-filter>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent-filter>

              </activity>

          </application>

      </manifest>
      EOF

      cat > app/src/main/res/values/styles.xml <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <resources>
          <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#3B82F6</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
          </style>
      </resources>
      EOF

      cat > app/src/main/res/layout/activity_main.xml <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
          android:layout_width="match_parent"
          android:layout_height="match_parent">

          <WebView
              android:id="@+id/webView"
              android:layout_width="match_parent"
              android:layout_height="match_parent"/>

          <ProgressBar
              android:id="@+id/progressBar"
              android:layout_width="48dp"
              android:layout_height="48dp"
              android:layout_gravity="center"/>

      </FrameLayout>
      EOF

      cat > app/src/main/java/com/minhaj/apps/MainActivity.java <<'EOF'
      package com.minhaj.apps;

      import android.app.Activity;
      import android.os.Bundle;
      import android.view.View;
      import android.webkit.WebChromeClient;
      import android.webkit.WebSettings;
      import android.webkit.WebView;
      import android.webkit.WebViewClient;
      import android.widget.ProgressBar;

      public class MainActivity extends Activity {

          private WebView webView;
          private ProgressBar progressBar;

          private static final String WEBSITE_URL =
              "https://mdmahinafrad-pixel.github.io/Minhaj-Apps/";

          @Override
          protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              setContentView(R.layout.activity_main);

              webView = findViewById(R.id.webView);
              progressBar = findViewById(R.id.progressBar);

              WebSettings settings = webView.getSettings();

              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setBuiltInZoomControls(false);
              settings.setDisplayZoomControls(false);

              webView.setWebChromeClient(new WebChromeClient());

              webView.setWebViewClient(new WebViewClient() {

                  @Override
                  public void onPageFinished(
                          WebView view,
                          String url) {
                      progressBar.setVisibility(View.GONE);
                  }

              });

              webView.loadUrl(WEBSITE_URL);
          }

          @Override
          public void onBackPressed() {

              if (webView.canGoBack()) {
                  webView.goBack();
              } else {
                  super.onBackPressed();
              }

          }
      }
      EOF

      wget -O app/src/main/res/drawable/app_icon.png \
      https://i.postimg.cc/k5qxxjHd/Tik-Tok-Logo-9D2F901.png

      cd ..

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build APK
    working-directory: MinhajApps
    run: gradle assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: MINHAJ-APPS
      path: MinhajApps/app/build/outputs/apk/debug/app-debug.apk
```
